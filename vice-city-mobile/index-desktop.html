<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>VICE CITY: STREET LIFE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #loading-screen.hidden { display: none; }
        #loading-logo { font-size: 3rem; font-weight: bold; text-shadow: 0 0 20px #00ffff; margin-bottom: 2rem; }
        #loading-bar-container { width: 80%; max-width: 400px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 5px; }
        #loading-bar { height: 20px; background: linear-gradient(90deg, #00ffff, #0080ff); border-radius: 8px; width: 0%; transition: width 0.3s; }
        #loading-text { margin-top: 1rem; font-size: 1rem; color: #aaa; }
        
        /* Main Menu */
        #main-menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        #main-menu.active { display: flex; }
        #menu-title { font-size: 4rem; font-weight: bold; text-shadow: 0 0 30px #00ffff; margin-bottom: 3rem; color: #00ffff; }
        #menu-buttons { display: flex; flex-direction: column; gap: 1rem; width: 80%; max-width: 400px; }
        .menu-button {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            background: rgba(0,128,255,0.8);
            border: 2px solid #00ffff;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .menu-button:hover { background: rgba(0,128,255,1); transform: scale(1.05); }
        .menu-button:active { background: rgba(0,255,255,0.8); }
        
        /* HUD */
        #hud {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            z-index: 100;
        }
        #hud.active { display: block; }
        #speedometer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 2rem;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #000;
        }
        #gear-display {
            position: absolute;
            bottom: 60px;
            left: 20px;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px #000;
        }
        #rpm-meter {
            position: absolute;
            bottom: 100px;
            left: 20px;
            font-size: 1rem;
            color: #ff0000;
        }
        
        /* Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 200px;
            display: none;
            pointer-events: none;
            z-index: 200;
        }
        #touch-controls.active { display: block; }
        .control-button {
            position: absolute;
            pointer-events: auto;
            background: rgba(255,255,255,0.2);
            border: 2px solid #00ffff;
            border-radius: 50%;
            touch-action: none;
        }
        .control-button.active { background: rgba(0,255,255,0.5); }
        #steering-left { width: 80px; height: 80px; left: 20px; bottom: 100px; }
        #steering-right { width: 80px; height: 80px; right: 20px; bottom: 100px; }
        #accelerate-btn { width: 60px; height: 60px; right: 20px; bottom: 20px; background: rgba(0,255,0,0.3); border-color: #00ff00; }
        #brake-btn { width: 60px; height: 60px; left: 20px; bottom: 20px; background: rgba(255,0,0,0.3); border-color: #ff0000; }
        
        /* Pause Menu */
        #pause-menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #pause-menu.active { display: flex; }
        #pause-title { font-size: 3rem; margin-bottom: 2rem; color: #00ffff; }
        #pause-buttons { display: flex; flex-direction: column; gap: 1rem; }
        
        /* Settings Menu */
        #settings-menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        #settings-menu.active { display: flex; }
        #settings-title { font-size: 2.5rem; margin-bottom: 2rem; color: #00ffff; }
        #settings-content { width: 90%; max-width: 500px; }
        .setting-row { display: flex; justify-content: space-between; padding: 1rem; border-bottom: 1px solid #333; }
        .setting-label { font-size: 1.2rem; }
        .setting-value { font-size: 1.2rem; color: #00ffff; }
        
        /* Race HUD */
        #race-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 300;
        }
        #race-hud.active { display: flex; }
        #race-countdown { font-size: 5rem; font-weight: bold; color: #ff0000; text-shadow: 0 0 20px #fff; }
        #race-position { font-size: 2rem; color: #00ffff; }
        #race-timer { font-size: 2rem; color: #fff; }
        
        /* Minimap */
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #00ffff;
            border-radius: 10px;
            display: none;
        }
        #minimap.active { display: block; }
        #minimap-canvas { width: 100%; height: 100%; border-radius: 8px; }
        
        /* Notification */
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.5rem;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div id="loading-logo">VICE CITY: STREET LIFE</div>
        <div id="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
        <div id="loading-text">Loading assets...</div>
    </div>
    
    <!-- Main Menu -->
    <div id="main-menu">
        <div id="menu-title">VICE CITY</div>
        <div id="menu-buttons">
            <button class="menu-button" id="continue-btn">CONTINUE</button>
            <button class="menu-button" id="new-game-btn">NEW GAME</button>
            <button class="menu-button" id="free-roam-btn">FREE ROAM</button>
            <button class="menu-button" id="race-btn">RACE</button>
            <button class="menu-button" id="garage-btn">GARAGE</button>
            <button class="menu-button" id="character-btn">CHARACTER</button>
            <button class="menu-button" id="map-btn">MAP</button>
            <button class="menu-button" id="settings-btn">SETTINGS</button>
        </div>
    </div>
    
    <!-- Settings Menu -->
    <div id="settings-menu">
        <div id="settings-title">SETTINGS</div>
        <div id="settings-content">
            <div class="setting-row">
                <span class="setting-label">Graphics Quality</span>
                <span class="setting-value" id="graphics-setting">Medium</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">Steering Sensitivity</span>
                <span class="setting-value" id="steering-setting">50%</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">Touch Controls</span>
                <span class="setting-value" id="controls-setting">Enabled</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">Camera Mode</span>
                <span class="setting-value" id="camera-setting">Chase</span>
            </div>
        </div>
        <button class="menu-button" id="settings-back-btn" style="margin-top: 2rem;">BACK</button>
    </div>
    
    <!-- HUD -->
    <div id="hud">
        <div id="speedometer">0 KM/H</div>
        <div id="gear-display">P</div>
        <div id="rpm-meter">0 RPM</div>
    </div>
    
    <!-- Race HUD -->
    <div id="race-hud">
        <div id="race-countdown">3</div>
        <div id="race-position">Position: 1/6</div>
        <div id="race-timer">00:00:00</div>
    </div>
    
    <!-- Minimap -->
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>
    
    <!-- Touch Controls -->
    <div id="touch-controls">
        <div class="control-button" id="steering-left"></div>
        <div class="control-button" id="steering-right"></div>
        <div class="control-button" id="accelerate-btn"></div>
        <div class="control-button" id="brake-btn"></div>
    </div>
    
    <!-- Pause Menu -->
    <div id="pause-menu">
        <div id="pause-title">PAUSED</div>
        <div id="pause-buttons">
            <button class="menu-button" id="resume-btn">RESUME</button>
            <button class="menu-button" id="restart-btn">RESTART</button>
            <button class="menu-button" id="pause-settings-btn">SETTINGS</button>
            <button class="menu-button" id="quit-btn">QUIT TO MENU</button>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification"></div>
    
    <script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VICE CITY: STREET LIFE - Mobile</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Three.js - Using local fallback -->
    <script src="js/three.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas { display: block; }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #loading-screen.hidden { display: none; }
        #loading-logo { font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 20px #00ffff; margin-bottom: 1.5rem; }
        #loading-bar-container { width: 85%; max-width: 350px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 4px; }
        #loading-bar { height: 18px; background: linear-gradient(90deg, #00ffff, #0080ff); border-radius: 8px; width: 0%; transition: width 0.3s; }
        #loading-text { margin-top: 1rem; font-size: 0.9rem; color: #aaa; text-align: center; }
        
        /* Mobile Menu - Larger buttons for touch */
        #main-menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 10px;
        }
        #main-menu.active { display: flex; }
        #menu-title { font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 20px #00ffff; margin-bottom: 2rem; color: #00ffff; }
        #menu-buttons { display: flex; flex-direction: column; gap: 12px; width: 95%; max-width: 350px; }
        .menu-button {
            padding: 14px 20px;
            font-size: 1.3rem;
            background: rgba(0,128,255,0.8);
            border: 2px solid #00ffff;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .menu-button:hover { background: rgba(0,128,255,1); }
        .menu-button:active { background: rgba(0,255,255,0.8); transform: scale(0.98); }
        
        /* HUD - Mobile optimized */
        #hud {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            z-index: 100;
        }
        #hud.active { display: block; }
        #speedometer {
            position: absolute;
            bottom: 80px;
            left: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #000, 0 0 20px #000;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 10px;
        }
        #gear-display {
            position: absolute;
            bottom: 130px;
            left: 15px;
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 0 0 10px #000;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 10px;
        }
        
        /* Touch Controls - Optimized for mobile */
        #touch-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 220px;
            display: none;
            pointer-events: none;
            z-index: 200;
        }
        #touch-controls.active { display: block; }
        
        /* Steering buttons - larger for mobile */
        .steering-btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(0,0,0,0.3);
            border: 3px solid #00ffff;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            bottom: 120px;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #00ffff;
        }
        #steering-left { left: 15px; }
        #steering-right { right: 15px; }
        
        /* Accelerate and brake - larger for mobile */
        .pedal-btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(0,0,0,0.3);
            border: 3px solid #00ffff;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            bottom: 20px;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
        }
        #accelerate-btn { right: 15px; background: rgba(0,255,0,0.3); border-color: #00ff00; }
        #brake-btn { left: 15px; background: rgba(255,0,0,0.3); border-color: #ff0000; }
        
        .control-button.active { background: rgba(0,255,255,0.5); }
        
        /* Nitro button */
        #nitro-btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(255,215,0,0.4);
            border: 3px solid #ffd700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #ffd700;
        }
        
        /* Pause Menu */
        #pause-menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #pause-menu.active { display: flex; }
        #pause-title { font-size: 2.5rem; margin-bottom: 2rem; color: #00ffff; }
        #pause-buttons { display: flex; flex-direction: column; gap: 12px; width: 80%; max-width: 300px; }
        
        /* Notification */
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1.3rem;
            display: none;
            z-index: 1000;
            text-align: center;
            max-width: 80%;
        }
        
        /* Mobile-specific: prevent default touch behavior */
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        
        /* Fullscreen button for mobile */
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #00ffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #00ffff;
            font-size: 1.5rem;
            z-index: 1000;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Fullscreen button -->
    <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div id="loading-logo">VICE CITY: STREET LIFE</div>
        <div id="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
        <div id="loading-text">Loading game...</div>
    </div>
    
    <!-- Main Menu -->
    <div id="main-menu">
        <div id="menu-title">VICE CITY</div>
        <div id="menu-buttons">
            <button class="menu-button" id="free-roam-btn">FREE ROAM</button>
            <button class="menu-button" id="race-btn">RACE</button>
            <button class="menu-button" id="settings-btn">SETTINGS</button>
        </div>
    </div>
    
    <!-- HUD -->
    <div id="hud">
        <div id="speedometer">0 KM/H</div>
        <div id="gear-display">P</div>
    </div>
    
    <!-- Touch Controls -->
    <div id="touch-controls">
        <div class="steering-btn control-button" id="steering-left">←</div>
        <div class="steering-btn control-button" id="steering-right">→</div>
        <div class="pedal-btn control-button" id="accelerate-btn">↑</div>
        <div class="pedal-btn control-button" id="brake-btn">↓</div>
        <div class="control-button" id="nitro-btn">N</div>
    </div>
    
    <!-- Pause Menu -->
    <div id="pause-menu">
        <div id="pause-title">PAUSED</div>
        <div id="pause-buttons">
            <button class="menu-button" id="resume-btn">RESUME</button>
            <button class="menu-button" id="restart-btn">RESTART</button>
            <button class="menu-button" id="quit-btn">QUIT TO MENU</button>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification"></div>
    
    <!-- Game canvas will be added by Three.js -->
    
    <!-- Load the game -->
    <script src="game/bundle-mobile.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#111122"/>
  
  <!-- City silhouette -->
  <rect x="50" y="200" width="40" height="150" fill="#333" rx="5"/>
  <rect x="100" y="180" width="50" height="180" fill="#444" rx="5"/>
  <rect x="160" y="160" width="40" height="200" fill="#555" rx="5"/>
  <rect x="210" y="200" width="50" height="150" fill="#333" rx="5"/>
  <rect x="270" y="170" width="60" height="190" fill="#444" rx="5"/>
  <rect x="340" y="190" width="45" height="160" fill="#555" rx="5"/>
  <rect x="395" y="210" width="35" height="140" fill="#333" rx="5"/>
  
  <!-- Road -->
  <rect x="0" y="350" width="512" height="20" fill="#333333" rx="10"/>
  <rect x="0" y="355" width="512" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="0" y="365" width="512" height="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- Car -->
  <ellipse cx="256" cy="370" rx="30" ry="15" fill="url(#grad1)"/>
  <rect x="226" y="365" width="60" height="10" fill="#00ffff" rx="5"/>
  
  <!-- Title -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#00ffff" text-anchor="middle">VICE CITY</text>
  <text x="256" y="485" font-family="Arial, sans-serif" font-size="16" fill="#00aaff" text-anchor="middle">STREET LIFE</text>
</svg>
